services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: print_workflow
      POSTGRES_USER: printapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U printapp -d print_workflow']
      interval: 5s
      retries: 10
  app:
    build: .
    environment: &application
      DATABASE_URL: ${DATABASE_URL:?Set postgresql+psycopg URL for the db service}
      PRINT_DATA_DIR: /data
      PRINT_DEV: '0'
      PRINT_ALLOWED_HOSTS: ${PRINT_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PRINT_ORIGIN: ${PRINT_ORIGIN:?Set the approved HTTPS public origin}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8000'
    volumes:
      - private-data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      retries: 3
  worker:
    build: .
    command: [python, -m, server.worker]
    environment: *application
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - private-data:/data
volumes:
  postgres:
  private-data:
